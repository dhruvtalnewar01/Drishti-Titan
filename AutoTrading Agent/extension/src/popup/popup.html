<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TITAN AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 340px;
      background: #080a12;
      color: #f0f0f5;
      font-family: 'Inter', -apple-system, sans-serif;
      padding: 0;
      overflow: hidden;
    }

    .popup-container {
      padding: 22px 20px 18px;
    }

    .popup-header {
      text-align: center;
      margin-bottom: 18px;
    }
    .popup-logo {
      font-size: 28px;
      font-weight: 900;
      background: linear-gradient(135deg, #7c4dff 0%, #00b0ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 5px;
    }
    .popup-subtitle {
      font-size: 9px;
      color: #5a5e72;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-top: 4px;
      font-weight: 600;
    }
    .popup-version {
      font-size: 8px;
      color: #3a3e52;
      margin-top: 2px;
      font-family: 'JetBrains Mono', monospace;
    }

    .popup-divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(124,77,255,0.3), transparent);
      margin: 0 0 16px;
    }

    .popup-status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 12px;
      margin-bottom: 14px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #5a5e72;
      flex-shrink: 0;
    }
    .status-dot.active {
      background: #00e676;
      box-shadow: 0 0 8px rgba(0,230,118,0.4);
      animation: blink 1.5s infinite;
    }
    .status-dot.paused {
      background: #ffab00;
      box-shadow: 0 0 8px rgba(255,171,0,0.3);
    }
    .status-text {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .popup-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 14px;
    }
    .popup-stat {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 10px;
      padding: 10px 12px;
      text-align: center;
    }
    .popup-stat-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 16px;
      font-weight: 700;
      color: #00e676;
    }
    .popup-stat-value.negative { color: #ff1744; }
    .popup-stat-label {
      font-size: 8px;
      color: #5a5e72;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-top: 3px;
      font-weight: 600;
    }

    .popup-info {
      font-size: 10px;
      color: #6a6e82;
      text-align: center;
      padding: 10px;
      line-height: 1.6;
      background: rgba(255,255,255,0.02);
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.04);
    }
    .popup-info strong {
      color: #a0a4b8;
    }

    .popup-footer {
      text-align: center;
      margin-top: 14px;
      font-size: 8px;
      color: #3a3e52;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }
    .gemini-dot {
      width: 4px; height: 4px;
      border-radius: 50%;
      background: #7c4dff;
      animation: blink 2s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
  </style>
</head>
<body>
  <div class="popup-container">
    <div class="popup-header">
      <div class="popup-logo">TITAN</div>
      <div class="popup-subtitle">AI Trading Agent</div>
      <div class="popup-version">v1.0.0 • Gemini 3.1 Pro</div>
    </div>

    <div class="popup-divider"></div>
    
    <div class="popup-status">
      <span class="status-dot" id="popup-status-dot"></span>
      <span class="status-text" id="popup-status-text">Checking...</span>
    </div>

    <div class="popup-stats">
      <div class="popup-stat">
        <div class="popup-stat-value" id="popup-pnl">₹0</div>
        <div class="popup-stat-label">Today P&L</div>
      </div>
      <div class="popup-stat">
        <div class="popup-stat-value" id="popup-trades" style="color: #00b0ff">0</div>
        <div class="popup-stat-label">Trades</div>
      </div>
    </div>

    <div class="popup-info">
      Open <strong>Zerodha Kite</strong> or <strong>Groww</strong> to see the 
      floating TITAN widget. Click the glowing <strong>T</strong> icon to expand the full dashboard.
    </div>

    <div class="popup-footer">
      <span class="gemini-dot"></span>
      <span>Powered by Google Gemini</span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
