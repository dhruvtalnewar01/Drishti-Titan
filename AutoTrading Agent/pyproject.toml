[project]
name = "titan-trading-agent"
version = "1.0.0"
description = "TITAN — God-Level AI Auto-Trading Agent with Multi-Agent Council"
requires-python = ">=3.12"
readme = "README.md"

dependencies = [
    # === Core Framework ===
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",

    # === AI / LLM ===
    "google-genai>=1.5.0",
    "langgraph>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-google-genai>=2.1.0",
    "chromadb>=0.6.0",

    # === Broker APIs ===
    "kiteconnect>=5.0.0",
    "pyotp>=2.9.0",

    # === Data & ML ===
    "pandas>=2.2.0",
    "numpy>=2.1.0",
    "scikit-learn>=1.6.0",
    "ta>=0.11.0",
    "torch>=2.5.0",

    # === Real-time & Networking ===
    "websockets>=14.0",
    "httpx>=0.28.0",
    "aiohttp>=3.11.0",
    "feedparser>=6.0.0",

    # === Database ===
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "redis>=5.2.0",
    "alembic>=1.14.0",

    # === Auth & Security ===
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.19",

    # === Utilities ===
    "python-dotenv>=1.0.0",
    "loguru>=0.7.3",
    "apscheduler>=3.11.0",
    "tenacity>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "black>=24.10.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.black]
line-length = 100
target-version = ["py312"]
